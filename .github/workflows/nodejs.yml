name: Node CI

on:
  push:
    branches:
      - main
      - stable
      - 'releases/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: node-ci-${{ github.ref }}
  cancel-in-progress: true

# Jobs run on ubuntu-24.04 instead of ubuntu-latest: Playwright 1.58 does not
# support Ubuntu 26.04, which ubuntu-latest becomes from 2026-10-19.
jobs:
  static:
    name: static (22.x)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.28.1
      - name: Use Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Typecheck tests
        run: pnpm typecheck:test

  tests:
    name: test (${{ matrix.node-version }} / ${{ matrix.suite }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
        suite: [unit, integration]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.28.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run ${{ matrix.suite }} tests
        run: pnpm test:${{ matrix.suite }}
        env:
          CI: true

  e2e:
    name: e2e (22.x)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.28.1
      - name: Use Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run e2e tests
        run: pnpm test:e2e
        env:
          CI: true

  pack:
    name: pack smoke (22.x)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.28.1
      - name: Use Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Build
        run: pnpm build
      - name: Pack smoke test
        run: pnpm test:pack
        env:
          CI: true

  audit:
    name: audit (22.x)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.28.1
      - name: Use Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Security audit (high+)
        # pnpm 10 still calls npm's retired audit endpoints. pnpm 11 uses the
        # bulk advisories API; --pm-on-fail prevents the packageManager field
        # from switching this one command back to pnpm 10.
        run: pnpm dlx pnpm@11.13.1 --pm-on-fail=ignore audit --audit-level high

  coverage:
    name: coverage (22.x)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.28.1
      - name: Use Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Coverage gate
        run: pnpm test:coverage
        env:
          CI: true
      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: error
